product_owner_research_analysis_design:
  description: >
    Investiga a fondo el producto {product}. Analiza el mercado objetivo, la competencia y las tendencias relevantes.
    Identifica las necesidades y deseos de los usuarios potenciales.
    Diseña las funcionalidades y requerimientos principales del producto, priorizando aquellas que aporten mayor valor.
    Asegúrate de considerar las restricciones técnicas y de negocio.
  expected_output: >
    Un documento que incluya:
    - Un resumen ejecutivo del producto {product}.
    - Un análisis del mercado y la competencia.
    - Un perfil detallado del usuario objetivo.
    - Una lista priorizada de funcionalidades y requerimientos del producto.
    - Un esquema de la arquitectura del producto.
  agent: product_owner

product_owner_create_specifications:
  description: >
    Crea un documento de especificaciones del producto completo y detallado.
    Incluye la visión del producto, los objetivos, las funcionalidades, los requisitos, los criterios de aceptación y cualquier otra información relevante.
    Asegúrate de que el documento sea claro, conciso y comprensible para todos los stakeholders.
  expected_output: >
    Un documento de especificaciones del producto completo y actualizado.
  agent: product_owner
  depends_on:
    - product_owner_research_analysis_design

product_owner_create_user_stories:
  description: >
    Crea al menos {num_stories} historias de usuario claras y concisas que describan las necesidades del usuario y el valor que se entregará.
    Asegúrate de que las historias de usuario sean independientes, negociables, valiosas, estimables, pequeñas y comprobables (INVEST).
  expected_output: >
    Un conjunto de historias de usuario bien escritas que representen los requisitos del producto.
  agent: product_owner
  depends_on:
    - product_owner_create_specifications

product_owner_create_product_backlog:
  description: >
    Crea el Product Backlog a partir del documento de especificaciones del producto.
    Desglosa las funcionalidades en elementos del backlog, como historias de usuario, tareas o errores.
    Puedes basarte en historias de usuario definidas previamente. Prioriza los elementos del backlog según el valor que aportan al producto y al negocio.
  expected_output: >
    Un Product Backlog completo y priorizado, listo para la planificación del sprint.
  agent: product_owner
  depends_on:
    - product_owner_create_user_stories

product_owner_refine_backlog:
  description: >
    Refina el Product Backlog, asegurando que los elementos estén detallados, estimados y priorizados. 
    Trabaja con el equipo para aclarar los requisitos y responder a las preguntas.  
    **Cuando hagas preguntas al equipo, usa este formato:**  
    - ❌ **Evita preguntas generales:** "¿Todo está claro con las historias de usuario?"  
    - ✅ **Usa preguntas detalladas:** "¿Hay dudas sobre la funcionalidad de la historia HU-05 respecto a la API de pagos? ¿Es necesario ajustar los criterios de aceptación?"  
    **Cuando des respuestas, asegúrate de proporcionar detalles útiles y estructurados.**
  expected_output: >
    Un Product Backlog actualizado y refinado, con elementos claros y listos para el próximo Sprint.
  agent: product_owner
  depends_on:
    - product_owner_create_product_backlog

product_owner_accept_increments:
  description: >
    Revisa y acepta los incrementos del producto completados por el equipo.
    Asegúrate de que cumplan con los criterios de aceptación y que entreguen valor al usuario.
  expected_output: >
    Una lista de incrementos del producto aceptados o rechazados, con comentarios claros para el equipo.
  agent: product_owner
  depends_on:
    - scrum_master_sprint_review


scrum_master_create_sprint_backlog:
  description: >
    Facilita la creación del Sprint Backlog durante la reunión de planificación del sprint.
    Ayuda al equipo a seleccionar los elementos del Product Backlog que se comprometerán a completar durante el sprint.
    Asegura que el Sprint Backlog sea claro, conciso y que refleje los objetivos del sprint.
    Ayuda al equipo a desglosar las tareas y estimar el esfuerzo requerido.
  expected_output: >
    Un Sprint Backlog completo y detallado que incluya:
    - Los elementos del Product Backlog seleccionados para el sprint.
    - Las tareas desglosadas y estimadas.
    - La asignación de tareas a los miembros del equipo.
  agent: scrum_master
  depends_on:
    - product_owner_create_product_backlog

  
scrum_master_sprint_planning:
  description: >
    Facilita la reunión de planificación del sprint.
    Asegúrate de que el equipo comprenda los objetivos del sprint y seleccione las tareas del backlog del producto que se comprometerá a completar.
    Ayuda al equipo a desglosar las tareas en subtareas y a estimar el esfuerzo requerido.
    Elimina cualquier impedimento que surja durante la reunión.
  expected_output: >
    Un plan de sprint claro y conciso que incluya:
    - Los objetivos del sprint.
    - Las tareas del sprint backlog.
    - La asignación de tareas a los miembros del equipo.
    - La estimación del esfuerzo para cada tarea.
  agent: scrum_master
  depends_on:
    - scrum_master_create_sprint_backlog

scrum_master_daily_scrum:
  description: >
    Facilita la reunión diaria de Scrum. 
    Asegúrate de que cada miembro del equipo proporcione información clara y estructurada al responder las siguientes preguntas: 
    1️⃣ ¿Qué hice ayer?  
    2️⃣ ¿Qué haré hoy?  
    3️⃣ ¿Hay algún impedimento que afecte mi trabajo?  
    Cuando los miembros del equipo mencionen impedimentos, **haz preguntas específicas y solicita detalles concretos** para poder ayudarles de manera efectiva.
  expected_output: >
    Una reunión diaria de Scrum efectiva y productiva que permita al equipo sincronizarse y avanzar hacia el objetivo del sprint.
  agent: scrum_master
  depends_on:
    - scrum_master_sprint_planning

scrum_master_monitor_sprint:
  description: >
    Monitorea el progreso del sprint y apoya al equipo en la resolución de impedimentos.
    Asegura que el equipo mantenga el enfoque en los objetivos del sprint.
    Interviene en caso de bloqueos o problemas de comunicación entre los miembros del equipo.
  expected_output: >
    Un sprint fluido y sin bloqueos, con reportes de problemas resueltos durante su desarrollo.
  agent: scrum_master
  depends_on:
    - scrum_master_daily_scrum

scrum_master_sprint_review:
  description: >
    Facilita la reunión de revisión del sprint.
    Asegúrate de que el equipo demuestre el trabajo completado durante el sprint.
    Recopila comentarios de los stakeholders.
    Ayuda al equipo a identificar mejoras para el próximo sprint.
  expected_output: >
    Una reunión de revisión del sprint que permita al equipo obtener retroalimentación valiosa y mejorar continuamente.
  agent: scrum_master
  depends_on:
    - scrum_master_sprint_planning

scrum_master_sprint_retrospective:
  description: >
    Facilita la reunión de retrospectiva del sprint.
    Ayuda al equipo a identificar qué funcionó bien, qué se puede mejorar y qué acciones se pueden tomar para mejorar el próximo sprint.
    Crea un ambiente seguro y colaborativo donde el equipo pueda compartir abiertamente sus ideas.
  expected_output: >
    Un plan de acción con mejoras concretas para el próximo sprint.
  agent: scrum_master
  depends_on:
    - scrum_master_sprint_review
